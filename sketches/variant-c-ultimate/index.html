<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant C — 游戏化奥特曼风</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#1a0a2e 0%,#0d1b3e 50%,#1a1a2e 100%);color:#e0e0e0;display:flex;min-height:100vh;position:relative;overflow-x:hidden}
/* Background glow */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(168,85,247,.08),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(255,182,39,.06),transparent 60%);pointer-events:none;z-index:0}
.sidebar{flex:0 0 90px;background:linear-gradient(180deg,#8B0000 0%,#1a1a2e 100%);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;border-right:2px solid rgba(255,182,39,.2);position:relative;z-index:1}
.sb-avatar{display:flex;flex-direction:column;align-items:center;padding:8px 0 16px;border-bottom:2px solid rgba(255,182,39,.2);width:100%;margin-bottom:8px}
.sb-avatar span:first-child{font-size:40px;filter:drop-shadow(0 0 12px rgba(255,182,39,.6));animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sb-avatar span:last-child{font-size:11px;font-weight:900;color:#ffb627;margin-top:4px;letter-spacing:1px;text-shadow:0 0 8px rgba(255,182,39,.5)}
.sb-item{display:flex;flex-direction:column;align-items:center;width:100%;padding:10px 8px;border:none;background:transparent;color:rgba(255,255,255,.4);font-size:14px;font-weight:700;cursor:pointer;border-left:3px solid transparent;font-family:inherit;transition:all .2s}
.sb-item:hover{color:rgba(255,255,255,.7);background:rgba(255,182,39,.05)}
.sb-item.active{color:#ffb627;font-weight:900;border-left-color:#ffb627;background:rgba(255,182,39,.1);text-shadow:0 0 10px rgba(255,182,39,.3)}
.sb-spacer{flex:1}
.main{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1}
/* Hero - game style */
.hero{display:flex;gap:14px}
.hero-chip{flex:1;display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:18px;background:rgba(26,26,46,.8);border:2px solid rgba(255,182,39,.2);backdrop-filter:blur(8px);box-shadow:0 0 20px rgba(255,182,39,.08),inset 0 1px 0 rgba(255,255,255,.05)}
.hero-chip.points{border-color:rgba(255,182,39,.5);background:linear-gradient(135deg,rgba(255,182,39,.15),rgba(255,138,0,.1))}
.hero-chip.points .hn{color:#ffb627;text-shadow:0 0 12px rgba(255,182,39,.4)}
.hc-icon{font-size:32px;filter:drop-shadow(0 0 6px rgba(255,182,39,.4))}
.hc-col{display:flex;flex-direction:column;gap:2px}
.hs{font-size:22px;font-weight:900;color:#fff}
.hn{font-size:28px;font-weight:900;color:#a855f7;text-shadow:0 0 10px rgba(168,85,247,.3)}
.ht{font-size:13px;font-weight:800;color:#4ade80;background:rgba(74,222,128,.1);padding:3px 10px;border-radius:99px;margin-top:4px;border:1px solid rgba(74,222,128,.2)}
/* XP bar in hero */
.xp-bar{width:100%;padding:0 20px 8px}
.xp-track{height:12px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;border:1px solid rgba(255,182,39,.15)}
.xp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb627,#ff8a00,#ff4d00);box-shadow:0 0 12px rgba(255,182,39,.5);animation:xp-glow 2s infinite alternate}
@keyframes xp-glow{0%{box-shadow:0 0 8px rgba(255,182,39,.3)}100%{box-shadow:0 0 16px rgba(255,182,39,.6)}}
.xp-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);margin-top:4px}
/* Dual columns */
.dual{display:flex;gap:20px}
.column{flex:1;display:flex;flex-direction:column;gap:12px}
.col-head{display:flex;align-items:center;justify-content:space-between}
.col-head h2{font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.1)}
.col-earned{font-size:14px;font-weight:800;color:#ffb627;padding:4px 14px;border-radius:99px;background:rgba(255,182,39,.1);border:1px solid rgba(255,182,39,.3);text-shadow:0 0 6px rgba(255,182,39,.3)}
/* Game card container */
.section-card{background:rgba(26,26,46,.6);border-radius:20px;padding:16px;border:2px solid rgba(255,182,39,.15);backdrop-filter:blur(4px);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.section-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ffb627,#a855f7,#3b82f6)}
/* Quest items */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:all .2s}
.task:hover{border-color:rgba(255,182,39,.3);background:rgba(255,182,39,.05);transform:translateX(4px)}
.task.done{opacity:.5;border-color:rgba(74,222,128,.2);background:rgba(74,222,128,.03)}
.task-emoji{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(59,130,246,.1));border:1px solid rgba(168,85,247,.2);flex-shrink:0}
.task-info{flex:1;min-width:0}
.task-name{font-size:16px;font-weight:700;color:#e0e0e0}
.task-pts{font-size:13px;font-weight:800;color:#ffb627;text-shadow:0 0 4px rgba(255,182,39,.3)}
.task-btn{padding:8px 18px;border-radius:12px;border:2px solid;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.task-btn.go{background:linear-gradient(135deg,rgba(255,182,39,.15),rgba(255,138,0,.1));color:#ffb627;border-color:rgba(255,182,39,.4);text-shadow:0 0 6px rgba(255,182,39,.3)}
.task-btn.go:hover{background:rgba(255,182,39,.25);box-shadow:0 0 16px rgba(255,182,39,.2)}
.task-btn.done-btn{background:rgba(74,222,128,.08);color:#4ade80;border-color:rgba(74,222,128,.3)}
/* XP progress */
.progress{display:flex;align-items:center;gap:10px;padding:6px 0}
.progress-bar{flex:1;height:10px;background:rgba(255,255,255,.04);border-radius:99px;overflow:hidden;border:1px solid rgba(255,182,39,.1)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4ade80,#22c55e);box-shadow:0 0 10px rgba(74,222,128,.4);transition:width .4s}
.progress-text{font-size:13px;font-weight:800;color:#4ade80;text-shadow:0 0 4px rgba(74,222,128,.3)}
/* Achievement badges */
.badges{display:flex;gap:8px;margin-top:4px}
.badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,182,39,.08);border:1px solid rgba(255,182,39,.15)}
.badge.locked{opacity:.25;filter:grayscale(1)}
@media(max-width:768px){.sidebar{display:none}.dual{flex-direction:column}.hero{flex-direction:column}}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sb-avatar"><span>🦸</span><span>Lv.3 迪迦</span></div>
  <button class="sb-item active">📋 冒险</button>
  <button class="sb-item">🏆 基地</button>
  <button class="sb-item">🛒 商城</button>
  <button class="sb-item">⚙️ 设置</button>
  <div class="sb-spacer"></div>
  <button class="sb-item" style="font-size:20px">👨‍👩‍👧</button>
</nav>
<div class="main">
  <div class="hero">
    <div class="hero-chip"><span class="hc-icon">📅</span><div class="hc-col"><span class="hs">周五 9.19</span><span style="font-size:13px;color:rgba(255,255,255,.4)">9月19日</span></div></div>
    <div class="hero-chip points"><span class="hc-icon">⭐</span><div class="hc-col"><span class="hn">1,280</span><span class="ht">+14 XP today</span></div></div>
    <div class="hero-chip"><span class="hc-icon">🔥</span><div class="hc-col"><span class="hs">5 天连续</span><span style="font-size:13px;font-weight:800;color:#a855f7">⚡ 迪迦形态</span></div></div>
  </div>
  <div class="xp-bar">
    <div class="xp-track"><div class="xp-fill" style="width:71%"></div></div>
    <div class="xp-label"><span>Lv.3 迪迦</span><span>5 / 7 天 → Lv.4 戴拿</span></div>
  </div>
  <div class="dual">
    <div class="column">
      <div class="col-head"><h2>📚 学校任务</h2><span class="col-earned">+8 XP</span></div>
      <div class="section-card">
        <div class="task done"><div class="task-emoji">📖</div><div class="task-info"><div class="task-name">语文预习第三课</div><div class="task-pts">+2 XP</div></div><button class="task-btn done-btn">✓ CLEARED</button></div>
        <div class="task"><div class="task-emoji">🔢</div><div class="task-info"><div class="task-name">数学口算20道</div><div class="task-pts">+2 XP</div></div><button class="task-btn go">⚔️ 闯关</button></div>
        <div class="task done"><div class="task-emoji">🔤</div><div class="task-info"><div class="task-name">英语跟读 Unit 2</div><div class="task-pts">+2 XP</div></div><button class="task-btn done-btn">✓ CLEARED</button></div>
        <div class="task"><div class="task-emoji">✏️</div><div class="task-info"><div class="task-name">练字15分钟</div><div class="task-pts">+2 XP</div></div><button class="task-btn go">⚔️ 闯关</button></div>
      </div>
      <div class="progress"><div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div><span class="progress-text">2 / 4 通关</span></div>
      <div class="badges"><div class="badge">📖</div><div class="badge">🔢</div><div class="badge locked">🔤</div><div class="badge locked">✏️</div></div>
    </div>
    <div class="column">
      <div class="col-head"><h2>🌟 拓展任务</h2><span class="col-earned">+6 XP</span></div>
      <div class="section-card">
        <div class="task done"><div class="task-emoji">♟️</div><div class="task-info"><div class="task-name">国象15分钟</div><div class="task-pts">+2 XP</div></div><button class="task-btn done-btn">✓ CLEARED</button></div>
        <div class="task"><div class="task-emoji">🧠</div><div class="task-info"><div class="task-name">思维训练</div><div class="task-pts">+2 XP</div></div><button class="task-btn go">⚔️ 闯关</button></div>
        <div class="task done"><div class="task-emoji">📚</div><div class="task-info"><div class="task-name">阅读15分钟</div><div class="task-pts">+2 XP</div></div><button class="task-btn done-btn">✓ CLEARED</button></div>
      </div>
      <div class="progress"><div class="progress-bar"><div class="progress-fill" style="width:66%"></div></div><span class="progress-text">2 / 3 通关</span></div>
      <div class="badges"><div class="badge">♟️</div><div class="badge locked">🧠</div><div class="badge">📚</div></div>
    </div>
  </div>
</div>
</body>
</html>
